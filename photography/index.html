<!doctype html>
<html lang="en">
<head>
  <script src="/js/gtag.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photography · Cihan Koseoglu</title>
  <meta name="description" content="Photography by Cihan Koseoglu.">
  <link rel="icon" href="/images/favicon.ico">
  <meta name="theme-color" content="#f7f7f7">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preload" href="/fonts/iosevka-regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/site.css">
  <style>
    /* Template C: "Essay". Big album covers stacked, then each album reads top to bottom like a photo book. */
    :root { --bg: #f7f7f7; --line: #e3ddd4; }
    body { background: var(--bg); font-size: 15px; line-height: 1.6; }
    a { color: inherit; text-decoration: none; }
    header { position: fixed; top: 0; left: 0; right: 0; z-index: 5; display: flex; justify-content: space-between; align-items: baseline; padding: 20px clamp(16px, 4vw, 56px); mix-blend-mode: difference; color: #fff; }
    header .here { opacity: .8; }
    .progress { position: fixed; top: 0; left: 0; height: 2px; background: var(--accent); width: 0; z-index: 6; }

    /* Album covers, stacked */
    .intro { padding: 22vh clamp(16px, 4vw, 56px) 10vh; max-width: 900px; }
    .intro h1 { font-size: clamp(48px, 9vw, 112px); line-height: .95; margin: 0 0 18px; letter-spacing: -0.02em; }
    .intro p { color: var(--muted); margin: 0; max-width: 460px; }
    /* All albums at a glance; scrolls sideways on phones */
    .row { display: flex; flex-wrap: wrap; gap: 10px 22px; margin: 36px 0 0; padding: 0; list-style: none; }
    .row a { display: flex; align-items: center; gap: 10px; }
    .row img { width: 44px; height: 44px; object-fit: cover; display: block; background: var(--line); flex: none; }
    .row b { display: block; font: 400 20px/1.1 var(--serif); transition: color .2s; white-space: nowrap; }
    .row small { color: var(--muted); font-size: 13px; }
    .row a:hover b { color: var(--accent); font-style: italic; }
    @media (max-width: 700px) {
      .row { flex-wrap: nowrap; overflow-x: auto; margin-right: calc(-1 * clamp(16px, 4vw, 56px)); padding-right: 16px;
             scrollbar-width: none; -webkit-overflow-scrolling: touch; }
      .row::-webkit-scrollbar { display: none; }
      .row li { flex: none; }
    }
    .cover { display: block; position: relative; margin: 0 clamp(16px, 4vw, 56px) 14vh; }
    /* Covers keep their own shape: full width, or narrower when 78vh tall would be too much. --r is width / height. */
    .cover img { display: block; width: min(100%, calc(78vh * var(--r))); height: auto; aspect-ratio: var(--r); background: var(--line); }
    .cover .label { display: flex; justify-content: space-between; align-items: baseline; margin-top: 16px; }
    .cover .label h2 { font-size: clamp(32px, 5vw, 56px); margin: 0; line-height: 1; transition: color .2s; }
    .cover:hover h2 { color: var(--accent); font-style: italic; }
    .cover .label span { color: var(--muted); }

    /* Essay */
    .essay-head { min-height: 92vh; display: grid; align-content: end; padding: 0 clamp(16px, 4vw, 56px) 8vh; color: #fff; position: relative; overflow: hidden; background: var(--text); }
    .essay-head > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .essay-head::before { content: ""; position: absolute; inset: 0; z-index: 1; background: linear-gradient(to top, rgba(0,0,0,.45), transparent 55%); }
    .essay-head > h1, .essay-head > p { position: relative; z-index: 2; }
    .essay-head h1 { font-size: clamp(48px, 10vw, 128px); line-height: .95; margin: 0 0 12px; }
    .essay-head p { margin: 0; opacity: .85; }
    .essay { padding: 14vh clamp(16px, 4vw, 56px) 4vh; }
    .essay figure { margin: 0 auto 14vh; }
    .essay img { width: 100%; height: auto; display: block; background: var(--line); }
    .essay figcaption { margin-top: 10px; color: var(--muted); font-size: 13px; }
    .essay .full { max-width: 100%; }
    .essay .inset { max-width: 980px; }
    .essay .narrow { max-width: 620px; }
    .essay .left { max-width: 760px; margin-left: 0; }
    .essay .right { max-width: 760px; margin-right: 0; }
    .essay .pair { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(16px, 4vw, 56px); max-width: 1180px; align-items: end; }
    .essay .pair figure { margin: 0; }
    .essay .pair-wrap { margin: 0 auto 14vh; }
    @media (max-width: 700px) {
      .essay .pair { grid-template-columns: 1fr; gap: 10vh; }
      .essay figure, .essay .pair-wrap { margin-bottom: 10vh; }
      .essay .left, .essay .right { max-width: 100%; }
    }
    .next { display: block; border-top: 1px solid var(--line); margin: 0 clamp(16px, 4vw, 56px); padding: 6vh 0 12vh; }
    .next span { color: var(--muted); }
    .next h2 { font-size: clamp(40px, 7vw, 88px); margin: 8px 0 0; line-height: 1; transition: color .2s; }
    .next:hover h2 { color: var(--accent); font-style: italic; }

    /* Lightbox: click a photo in an album to see it on its own at up to 95% of the screen. */
    .essay img, .essay-head { cursor: zoom-in; }
    .lightbox { position: fixed; inset: 0; z-index: 60; outline: none; display: grid; place-items: center; background: rgba(247,247,247,.94);
                -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); opacity: 0; transition: opacity .25s ease; cursor: zoom-out; }
    .lightbox.open { opacity: 1; }
    .lightbox img { max-width: 95vw; max-height: 95vh; width: auto; height: auto; object-fit: contain; display: block;
                    box-shadow: 0 10px 40px rgba(0,0,0,.18); transform: scale(.97); transition: transform .25s ease; }
    .lightbox.open img { transform: none; }
    .lightbox button { position: absolute; border: 0; background: none; color: var(--text); font: inherit; cursor: pointer; padding: 14px 18px; opacity: .6; transition: opacity .2s; }
    .lightbox button:hover, .lightbox button:focus-visible { opacity: 1; }
    .lightbox .close { top: 0; right: 0; font-size: 28px; line-height: 1; }
    .lightbox .prev, .lightbox .next-photo { top: 50%; transform: translateY(-50%); font-size: 28px; }
    .lightbox .prev { left: 0; }
    .lightbox .next-photo { right: 0; }
    .lightbox .count { position: absolute; bottom: 0; left: 0; right: 0; text-align: center; padding: 0 0 6px; color: var(--muted); font-size: 12px; }
    @media (hover: none) { .lightbox .prev, .lightbox .next-photo { display: none; } }
    @media (prefers-reduced-motion: reduce) { .lightbox, .lightbox img { transition: none; } }

    .fade { opacity: 0; transform: translateY(24px); transition: opacity .9s ease, transform .9s ease; }
    .fade.in { opacity: 1; transform: none; }
    @media (prefers-reduced-motion: reduce) { .fade { opacity: 1; transform: none; transition: none; } }
  </style>
</head>
<body>
  <div class="progress" id="progress"></div>
  <header><a href="/">Cihan Koseoglu</a><a class="here" id="here" href="#">Photography</a></header>
  <main id="app"></main>

  <script src="/photography/albums.js"></script>
  <script>
    var app = document.getElementById('app'), here = document.getElementById('here'), progress = document.getElementById('progress');
    var SITE = 'Cihan Koseoglu';
    var find = function (slug) { return ALBUMS.filter(function (a) { return a.slug === slug; })[0]; };
    var kind = function (p) { var r = p.w / p.h; return r > 1.15 ? 'land' : r < 0.87 ? 'port' : 'sq'; };
    var pad = function (n) { return String(n).padStart(2, '0'); };

    // Small DOM helper: el('a', { className: 'x', href: '#' }, child, 'text', ...)
    function el(tag, props) {
      var node = document.createElement(tag);
      for (var k in props || {}) {
        if (k === 'style') node.setAttribute('style', props[k]);
        else node[k] = props[k];
      }
      for (var i = 2; i < arguments.length; i++) {
        var c = arguments[i];
        if (c != null) node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
      }
      return node;
    }

    // Every photo has NN.jpg (2400px) and NN-1200.jpg; the browser picks one from srcset and sizes.
    function photo(p, sizes, alt, lazy) {
      var long = Math.max(p.w, p.h), img = el('img', { alt: alt, width: p.w, height: p.h, sizes: sizes });
      if (long > 1200) img.srcset = p.src.replace(/\.jpg$/, '-1200.jpg') + ' ' + Math.round(p.w * 1200 / long) + 'w, ' + p.src + ' ' + p.w + 'w';
      img.src = p.src;
      if (lazy) img.loading = 'lazy';
      return img;
    }
    var altFor = function (album, p, n) { return p.alt || album.title + ', photo ' + n + ' of ' + album.photos.length; };
    var meta = function (a) { return a.year + ' · ' + a.photos.length + (a.photos.length === 1 ? ' photo' : ' photos'); };

    function renderList() {
      here.textContent = 'Photography';
      document.title = 'Photography · ' + SITE;
      var row = el('ul', { className: 'row' });
      ALBUMS.forEach(function (a) {
        row.appendChild(el('li', null, el('a', { href: '#/' + a.slug },
          el('img', { src: a.thumb || a.cover, alt: '', width: 44, height: 44 }),
          el('span', null, el('b', null, a.title), el('small', null, String(a.year))))));
      });
      app.replaceChildren(el('section', { className: 'intro' },
        el('h1', { className: 'serif' }, 'Photography'),
        el('p', null, 'Albums, newest first. Click one to read it from start to finish.'),
        row));
      ALBUMS.forEach(function (a) {
        var p = a.photos[0], r = (p.w / p.h).toFixed(4);
        var img = el('img', { src: a.cover, alt: 'Cover of the ' + a.title + ' album', loading: 'lazy', style: '--r:' + r,
                              width: p.w, height: p.h, sizes: 'min(calc(100vw - 32px), calc(78vh * ' + r + '))' });
        if (a.thumb) img.srcset = a.thumb + ' ' + Math.round(400 * Math.min(1, p.w / p.h)) + 'w, ' + a.cover + ' ' + Math.round(1600 * Math.min(1, p.w / p.h)) + 'w';
        app.appendChild(el('a', { className: 'cover fade', href: '#/' + a.slug }, img,
          el('div', { className: 'label' }, el('h2', { className: 'serif' }, a.title), el('span', null, meta(a)))));
      });
    }

    // Lay photos out with a rhythm: landscapes alternate between full width and offset,
    // two portraits in a row become a pair, squares sit narrow and centred.
    var SIZES = {
      full: '100vw', inset: '(max-width: 1090px) 100vw, 980px', left: '(max-width: 870px) 100vw, 760px',
      right: '(max-width: 870px) 100vw, 760px', narrow: '(max-width: 730px) 100vw, 620px', pair: '(max-width: 700px) 100vw, 50vw'
    };
    function layout(album, start) {
      var photos = album.photos, frag = document.createDocumentFragment(), wide = 0, i = start;
      var fig = function (p, n, cls) {
        return el('figure', { className: 'fade ' + (cls === 'pair' ? '' : cls) },
          photo(p, SIZES[cls], altFor(album, p, n), true),
          el('figcaption', null, pad(n) + ' / ' + photos.length));
      };
      while (i < photos.length) {
        var p = photos[i], k = kind(p);
        if (k === 'port' && photos[i + 1] && kind(photos[i + 1]) !== 'land') {
          frag.appendChild(el('div', { className: 'pair-wrap' }, el('div', { className: 'pair' }, fig(p, i + 1, 'pair'), fig(photos[i + 1], i + 2, 'pair'))));
          i += 2; continue;
        }
        frag.appendChild(fig(p, i + 1, k === 'land' ? ['full', 'left', 'inset', 'right'][wide++ % 4] : 'narrow'));
        i++;
      }
      return frag;
    }

    function renderAlbum(album) {
      here.textContent = 'All albums';
      document.title = album.title + ' · Photography · ' + SITE;
      var idx = ALBUMS.indexOf(album), next = ALBUMS[(idx + 1) % ALBUMS.length], first = album.photos[0];
      // The first photo (the cover) fills the header; the rest are numbered from 02.
      var head = photo(first, 'max(100vw, calc(92vh * ' + (first.w / first.h).toFixed(4) + '))', altFor(album, first, 1), false);
      app.replaceChildren(
        el('section', { className: 'essay-head' }, head, el('h1', { className: 'serif' }, album.title), el('p', null, meta(album))),
        el('section', { className: 'essay' }, layout(album, 1)),
        el('a', { className: 'next', href: '#/' + next.slug }, el('span', null, 'Next album'), el('h2', { className: 'serif' }, next.title)));
    }

    // Lightbox. Shows the full 2400px file; arrow keys or a swipe move through the album, Esc or a click closes it.
    var box = null, boxImgs = [], boxAt = 0;
    function showPhoto(i) {
      boxAt = (i + boxImgs.length) % boxImgs.length;
      var from = boxImgs[boxAt], img = box.querySelector('img');
      img.src = from.currentSrc || from.src;
      img.alt = from.alt;
      if (from.currentSrc && from.currentSrc !== from.src) {
        var full = new Image();
        full.onload = function () { if (boxImgs[boxAt] === from) img.src = from.src; };
        full.src = from.src;
      }
      box.querySelector('.count').textContent = pad(boxAt + 1) + ' / ' + boxImgs.length;
    }
    function openBox(target) {
      boxImgs = [].slice.call(app.querySelectorAll('.essay-head > img, .essay img'));
      var lastFocus = document.activeElement;
      box = el('div', { className: 'lightbox', tabIndex: -1, role: 'dialog', ariaModal: 'true', ariaLabel: 'Photo viewer' },
        el('img', { alt: '' }),
        el('button', { className: 'close', ariaLabel: 'Close' }, '×'),
        el('button', { className: 'prev', ariaLabel: 'Previous photo' }, '←'),
        el('button', { className: 'next-photo', ariaLabel: 'Next photo' }, '→'),
        el('div', { className: 'count' }));
      box.lastFocus = lastFocus;
      box.addEventListener('click', function (e) {
        if (e.target.classList.contains('prev')) showPhoto(boxAt - 1);
        else if (e.target.classList.contains('next-photo')) showPhoto(boxAt + 1);
        else closeBox();
      });
      var x0 = null;
      box.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; }, { passive: true });
      box.addEventListener('touchend', function (e) {
        var dx = x0 == null ? 0 : e.changedTouches[0].clientX - x0;
        if (Math.abs(dx) > 50) { e.preventDefault(); showPhoto(boxAt + (dx < 0 ? 1 : -1)); }
        x0 = null;
      });
      document.body.appendChild(box);
      document.documentElement.style.overflow = 'hidden';
      showPhoto(boxImgs.indexOf(target));
      box.focus({ preventScroll: true });
      requestAnimationFrame(function () { requestAnimationFrame(function () { box && box.classList.add('open'); }); });
    }
    function closeBox() {
      if (!box) return;
      var b = box; box = null;
      document.documentElement.style.overflow = '';
      if (b.lastFocus && b.lastFocus.focus) b.lastFocus.focus({ preventScroll: true });
      b.classList.remove('open');
      setTimeout(function () { b.remove(); }, 250);
    }
    app.addEventListener('click', function (e) {
      // The header photo sits under a gradient, so a click anywhere in the header opens it.
      var head = e.target.closest && e.target.closest('.essay-head');
      if (head) openBox(head.querySelector('img'));
      else if (e.target.matches && e.target.matches('.essay img')) openBox(e.target);
    });
    addEventListener('keydown', function (e) {
      if (!box) return;
      if (e.key === 'Escape') closeBox();
      else if (e.key === 'ArrowRight') showPhoto(boxAt + 1);
      else if (e.key === 'ArrowLeft') showPhoto(boxAt - 1);
      else if (e.key === 'Tab') { e.preventDefault(); box.querySelector('.close').focus(); }
    });

    var io = 'IntersectionObserver' in window ? new IntersectionObserver(function (es) {
      es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
    }, { rootMargin: '0px 0px -8% 0px' }) : null;

    // Coming back from an album to the index puts you where you were on the index.
    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    var onList = false, listScroll = 0;
    function route() {
      var slug = location.hash.replace(/^#\/?/, '').split('/')[0], album = slug && find(slug);
      if (onList) listScroll = scrollY;
      onList = !album;
      album ? renderAlbum(album) : renderList();
      window.scrollTo(0, onList ? listScroll : 0);
      app.querySelectorAll('.fade').forEach(function (el) { io ? io.observe(el) : el.classList.add('in'); });
      onScroll();
    }
    function onScroll() {
      var h = document.documentElement.scrollHeight - innerHeight;
      progress.style.width = (h > 0 ? scrollY / h * 100 : 0) + '%';
    }
    addEventListener('scroll', onScroll, { passive: true });
    addEventListener('hashchange', function () { closeBox(); route(); });
    route();
  </script>
  <script src="/js/consent.js"></script>
  <script src="/js/analytics.js"></script>
  <script src="/js/konami.js"></script>
</body>
</html>
