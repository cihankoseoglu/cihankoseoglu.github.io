<!doctype html>
<html lang="en">
<head>
  <script src="/js/gtag.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Cihan Koseoglu</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#faf8f5">
  <link rel="icon" href="/images/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preload" href="/fonts/iosevka-regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/site.css">
  <style>
    :root { --bg: #faf8f5; }
    body { background: var(--bg); font-size: 17px; line-height: 1.65; }
    .life {
      display: block; width: 100%; height: clamp(160px, 26vh, 260px); cursor: crosshair; touch-action: pan-y;
      -webkit-mask-image: linear-gradient(to bottom, #000 40%, transparent);
              mask-image: linear-gradient(to bottom, #000 40%, transparent);
    }
    @media (max-width: 599px) { .life { height: 120px; } }
    main { max-width: 640px; margin: 0 auto; padding: 40px 20px 64px; }
    h1 { font: 400 clamp(44px, 9vw, 64px)/1.05 var(--serif); letter-spacing: -0.01em; margin: 0 0 14px; }
    main p { color: var(--muted); font-size: 19px; margin: 0 0 28px; }
    a.home {
      display: inline-block; padding: 8px 16px; border: 1px solid var(--line); border-radius: 999px;
      color: var(--text); font-weight: 500; font-size: 15px; text-decoration: none; transition: background .2s, border-color .2s;
    }
    a.home:hover { background: var(--accent-soft); border-color: var(--accent); }
  </style>
</head>
<body>
  <canvas id="life" class="life" aria-hidden="true"></canvas>
  <main>
    <h1>Page not found</h1>
    <p>Nothing lives at this address. The cells above don't mind.</p>
    <a class="home" href="/">Back to the home page</a>
  </main>
  <script src="/js/life.js"></script>
  <script src="/js/consent.js"></script>
  <script src="/js/analytics.js"></script>
</body>
</html>
